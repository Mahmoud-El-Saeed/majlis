[project]
name = "majlis-api"
version = "0.1.0"
description = "Majlis private LMS API — ticket 01 bootstrap + identity"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.1",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "pyjwt>=2.10",
  "pwdlib[argon2]>=0.2",
  "redis[hiredis]>=5.0",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "email-validator>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "anyio>=4.4",
  "ruff==0.16.6",
  "ty>=0.0.1a",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.fastapi]
entrypoint = "app.main:app"
