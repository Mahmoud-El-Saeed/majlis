<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo-star.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مجلس — Majlis</title>
    <script>
      // Ticket 16: apply the stored theme before first paint (stored choice
      // wins, otherwise the OS preference on first visit, otherwise light).
      (function () {
        try {
          var saved = localStorage.getItem('mj_theme')
          var dark =
            saved === 'dark'
              ? true
              : saved === 'light'
                ? false
                : window.matchMedia &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* light default */
        }
        // Account language pilot: apply stored lang/dir before first paint
        // so the document never flashes the wrong direction.
        try {
          var lang = localStorage.getItem('mj_lang')
          if (lang !== 'ar' && lang !== 'en') lang = 'ar'
          document.documentElement.lang = lang
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
        } catch (e) {
          /* Arabic RTL default from the markup */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
