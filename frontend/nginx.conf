# Static SPA container. Security headers live at the compose reverse proxy
# (infra/nginx.conf) — this server is internal-only and must not be published
# directly.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite emits content-hashed files: cache them hard.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routes (/dashboard, /courses/:id, ...) all boot index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
