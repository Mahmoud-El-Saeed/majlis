services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: majlis
      POSTGRES_PASSWORD: majlis
      POSTGRES_DB: majlis
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U majlis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.0
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "6333:6333"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://majlis:majlis@postgres:5432/majlis
      REDIS_URL: redis://redis:6379/0
      # Ticket 22 (ADR-0009): compose is the production unit — the interactive
      # API contract (/docs, /redoc, /openapi.json) is disabled by default.
      # Override APP_ENV=dev only for a temporary compose-run smoke check.
      APP_ENV: ${APP_ENV:-prod}
      # Ticket 22 (ADR-0011): one trusted proxy (nginx; Cloudflare in front)
      # marshals X-Forwarded-For, and rate-limit buckets key on the real
      # client it reports instead of on the proxy's own address.
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-1}
      # Secrets and identity come from the shell environment (or an
      # `infra/.env` file, gitignored) — never hardcoded here. Dev defaults
      # below are insecure placeholders for local-only runs.
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-change-me}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      VERIFICATION_TOKEN_EXPIRE_HOURS: 24
      RESET_TOKEN_EXPIRE_HOURS: 1
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-Majlis <no-reply@majlis.local>}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      # First-admin bootstrap (seeded on API startup; no-op when unset).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Seam 3 storage (ticket 05): Cloudflare R2 credentials come from the
      # shell environment (or an `infra/.env` file) — never hardcoded here.
      # R2 CORS (set once in the Cloudflare dashboard for the bucket).
      # Valid values only: real scheme://host origins (no placeholders),
      # methods GET/PUT/HEAD/DELETE (OPTIONS is rejected). Minimal rule:
      # [{"AllowedOrigins": ["http://localhost:5173", "http://localhost:8080"],
      #   "AllowedMethods": ["PUT", "GET", "HEAD"],
      #   "AllowedHeaders": ["Content-Type", "Content-Length", "Range"],
      #   "ExposeHeaders": ["ETag", "Accept-Ranges", "Content-Range", "Content-Length"],
      #   "MaxAgeSeconds": 3600}]
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-majlis-media}
      S3_UPLOAD_EXPIRE_SEC: 900
      S3_PLAY_EXPIRE_SEC: 3600
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Vite bakes this at build time: same-origin /api/v1, forwarded by
        # reverse-proxy. A runtime environment variable would have no effect.
        VITE_API_URL: /api/v1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  reverse-proxy:
    image: nginx:alpine
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"

volumes:
  pgdata:
  redisdata:
  qdrantdata:
