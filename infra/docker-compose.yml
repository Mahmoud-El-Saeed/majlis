services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: majlis
      POSTGRES_PASSWORD: majlis
      POSTGRES_DB: majlis
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U majlis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.0
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "6333:6333"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://majlis:majlis@postgres:5432/majlis
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-only-insecure-secret-change-me
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      VERIFICATION_TOKEN_EXPIRE_HOURS: 24
      RESET_TOKEN_EXPIRE_HOURS: 1
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: "Majlis <no-reply@majlis.local>"
      FRONTEND_URL: http://localhost:8080
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  reverse-proxy:
    image: nginx:alpine
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"

volumes:
  pgdata:
  redisdata:
  qdrantdata:
