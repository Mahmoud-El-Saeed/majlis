events {}

http {
  upstream api {
    server api:8000;
  }

  server {
    listen 80;

    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://api;
    }

    # Frontend static fallback (Cloudflare Pages in prod; nginx fallback in VPS).
    # Ticket 01 serves minimal placeholder; real SPA lands with frontend build.
    location / {
      return 200 'Majlis API proxy ok. Frontend via Cloudflare Pages.\n';
      add_header Content-Type text/plain;
    }
  }
}
