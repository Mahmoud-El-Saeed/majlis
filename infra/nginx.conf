events {}

http {
  upstream api {
    server api:8000;
  }

  upstream frontend {
    server frontend:80;
  }

  server {
    listen 80;

    # Baseline security headers (ticket 22, ADR-0010). `always` also stamps
    # 4xx/5xx responses. /api/ and /health stay JSON-only (`default-src
    # 'none'`); location / stamps the SPA policy below. HSTS is deliberately
    # not set: TLS terminates at Cloudflare, so it belongs at the edge
    # (same ADR).

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Ticket 25: the API stamps ADR-0010's headers itself (Heroku has no
    # nginx). Hide the upstream copies so nginx remains the single source.
    # `proxy_hide_header` inherits into every proxied location (unlike
    # `add_header`), so this block is not repeated; `location /` re-adds the
    # SPA variants below.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;

    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://api;
    }

    # Single-page app served by the frontend container (own nginx, static
    # build). The browser calls same-origin /api/v1, proxied above.
    # NOTE: a location with its own add_header cancels inherited headers, so
    # the four shared baseline headers plus the SPA CSP are repeated here on
    # purpose — do not use this block as evidence the server-level block is
    # redundant (ADR-0010). The SPA needs `default-src 'self'`, not the API's
    # `'none'`: scripts/styles/fonts ship same-origin, inline style
    # attributes are used by the UI, audio playback and presigned uploads go
    # to R2 over https.
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
  }
}
