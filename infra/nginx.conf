events {}

http {
  upstream api {
    server api:8000;
  }

  server {
    listen 80;

    # Baseline security headers (ticket 22, ADR-0010). `always` also stamps
    # 4xx/5xx responses. This host serves only the JSON API, so CSP
    # `default-src 'none'` is safe here. HSTS is deliberately not set:
    # TLS terminates at Cloudflare, so it belongs at the edge (same ADR).

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://api;
    }

    # Frontend static fallback (Cloudflare Pages in prod; nginx fallback in
    # VPS). Ticket 01 serves minimal placeholder; real SPA lands with frontend
    # build.
    # NOTE: a location with its own add_header cancels inherited headers, so
    # the five baseline headers are repeated here on purpose — do not use
    # this block as evidence the server-level block is redundant (ADR-0010).
    location / {
      return 200 'Majlis API proxy ok. Frontend via Cloudflare Pages.\n';
      add_header Content-Type text/plain;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }
  }
}
